name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  tests:
    name: Unit and Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build test projects
        run: |
          dotnet build tests/DevToolbar.Tests.Unit -c Release
          dotnet build tests/DevToolbar.Tests.E2E -c Release

      - name: Unit tests
        run: >
          dotnet test tests/DevToolbar.Tests.Unit -c Release --no-build
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Install Playwright Chromium
        run: pwsh tests/DevToolbar.Tests.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Playwright E2E tests
        run: >
          dotnet test tests/DevToolbar.Tests.E2E -c Release --no-build
          --logger "trx;LogFileName=e2e.trx" --results-directory TestResults

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults
            doc/screenshots
          if-no-files-found: ignore

  windows-host:
    name: Build WPF host
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build DevToolbar.Windows
        run: dotnet build src/DevToolbar.Windows -c Release
